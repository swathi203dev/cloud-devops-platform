apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-devops-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-devops-platform
  template:
    metadata:
      labels:
        app: cloud-devops-platform
    spec:
      containers:
        - name: website
          image: swathireddy203/cloud-devops-platform:latest
          ports:
            - containerPort: 8000
